name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the minimum (requires-python) and the Docker image; 3.14 has
        # numpy/pandas wheels in uv.lock and the suite passes on it.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Also part of the cache key, so each matrix leg caches separately.
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml
      # (--frozen would install the stale lock and pass).
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v --tb=short --cov=src/simulator --cov-branch --cov-report=xml --cov-report=html

      # Coverage is identical across versions; report it once (also avoids
      # artifact-name collisions between matrix legs).
      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage HTML report as artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/
