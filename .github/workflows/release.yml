name: Release

# Every push to main updates the release PR. Merging that PR tags the
# release, creates the GitHub Release, and publishes to PyPI. Keep this
# file name: PyPI's trusted publisher matches the calling workflow.
on:
  push:
    branches: [main]

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    permissions:
      id-token: write
      contents: read
