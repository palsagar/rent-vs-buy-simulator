name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC: catches advisories published after the last merge.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Audit exactly what uv.lock pins for production (no dev group), so a
      # finding here is something users of the app or the PyPI package run.
      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --no-hashes -o requirements-audit.txt

      # --no-deps: the export is already fully resolved. --disable-pip: audit the
      # file as written instead of building a throwaway environment.
      - name: Audit against the PyPI advisory database
        run: uvx pip-audit==2.10.1 -r requirements-audit.txt --no-deps --disable-pip
