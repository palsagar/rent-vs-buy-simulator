name: Linting & Formatting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Use the ruff pinned in uv.lock (the dev group), not the newest release
      # that `uvx ruff` fetches, so CI checks exactly what `uv run ruff` checks
      # locally. A new ruff version then arrives through a lockfile update.
      - name: Run linting checks
        run: |
          uv run --frozen --only-group dev ruff check --output-format=github .

      - name: Run formatting checks
        run: |
          uv run --frozen --only-group dev ruff format --check .
