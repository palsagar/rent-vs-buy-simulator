# Fast, offline-friendly checks only. Tests (pytest, Playwright) run in CI and on
# demand: a multi-second test run on every commit makes people use --no-verify,
# which defeats the hook.
# Install once:  uv tool install pre-commit && pre-commit install
exclude: ^tests/fixtures/   # vendored third-party script; keep byte-identical
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Local hooks run the ruff pinned in uv.lock, the same way lint.yml does, so
  # the hook and CI cannot disagree after a Dependabot ruff bump.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen --only-group dev ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --only-group dev ruff format
        language: system
        types: [python]
        require_serial: true
